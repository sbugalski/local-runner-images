# CI Validation

name: macOS UTM scripts

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'images/macos/**'
      - '.github/workflows/macos-utm.yml'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # SC2096: the shebang with several options is required by images.CI/shebang-linter.ps1
      - name: Run ShellCheck
        run: shellcheck -x -P SCRIPTDIR -P SCRIPTDIR/.. -s bash -e SC2096 images/macos/utm/*.sh images/macos/utm/tests/*.sh

  unit-tests:
    name: Unit tests (bash 3.2)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Run helper tests
        run: /bin/bash images/macos/utm/tests/utm-helpers.tests.sh

  packer-validate:
    name: Validate templates with the null builder
    runs-on: ubuntu-24.04
    env:
      PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PKR_VAR_vm_password: validate
      PKR_VAR_github_api_pat: ''
      PKR_VAR_xcode_install_sas: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate base VM template
        working-directory: images/macos/utm
        run: packer validate -var vm_host=192.168.64.2 -var vm_username=runner base-vm.pkr.hcl

      # Same variables as build-image.sh passes, so a new required variable upstream fails here
      - name: Validate image templates
        working-directory: images/macos/templates
        run: |
          for template in macOS-14.arm64.anka.pkr.hcl macOS-15.arm64.anka.pkr.hcl macOS-26.arm64.anka.pkr.hcl xcode-27.arm64.anka.pkr.hcl; do
            echo "Validating $template"
            packer init "$template"
            packer validate \
              -var builder_type=null \
              -var source_vm_name=192.168.64.2 \
              -var build_id=validate \
              -var vm_username=runner \
              -var xcode_install_storage_url=http://192.168.64.1:8642/ \
              "$template"
          done
